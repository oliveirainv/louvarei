<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nosso Hinário</title>
<style>
:root {
  --text: #000;
  --link: #0000EE;
  --bg: #fff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
}
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 34px 20px 56px;
}
h1 {
  font-size: 2.2rem;
  line-height: 1.15;
  margin: 0 0 28px;
}
ol {
  padding-left: 2rem;
}
#lista-hinos {
  list-style: none;
  padding-left: 0;
  margin-left: 0;
}
li {
  margin: 0 0 14px;
  font-size: 1.28rem;
  line-height: 1.45;
}
.index-link {
  color: var(--link);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.index-button {
  display: inline-block;
  margin: 0 0 28px;
  padding: 14px 22px;
  border: 2px solid #000;
  border-radius: 8px;
  color: #fff;
  text-decoration: none;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1.08rem;
  font-weight: 700;
  line-height: 1;
  background: #000;
}
.index-button:hover,
.index-button:focus {
  background: #222;
}
.hymn-number {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1rem;
  margin: -14px 0 22px;
}
.letter {
  font-size: 1.28rem;
  line-height: 1.62;
  white-space: pre-wrap;
}
.message {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1rem;
}

.ordenacao {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 5px;
  margin: -8px 0 20px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 0.9rem;
}
.ordenacao select {
  padding: 3px 5px;
  border: 1px solid #777;
  border-radius: 2px;
  background: #fff;
  color: #000;
  font: inherit;
}

.admin-link {
  margin-top: 42px;
  padding-top: 18px;
  border-top: 1px solid #ddd;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 0.88rem;
  text-align: right;
}
.admin-link a {
  color: #555;
}

@media (max-width: 600px) {
  main { padding: 26px 18px 48px; }
  h1 { font-size: 1.9rem; }
  li, .letter { font-size: 1.16rem; }
}
</style>
</head>
<body>
<main>
  <h1>Nosso Hinário</h1>

  <div class="ordenacao">
    <label for="ordenar">Ordenar por:</label>
    <select id="ordenar" onchange="mudarOrdenacao(this.value)">
      <option value="numero">Número</option>
      <option value="titulo" selected>Nome</option>
    </select>
  </div>

  <ul id="lista-hinos"></ul>
  <p id="mensagem" class="message"></p>

  <div class="admin-link">
    <a href="admin.html">Administrador</a>
  </div>
</main>

<script>
let hinosCarregados = [];
let ordenacaoAtual = 'titulo';

async function carregarIndice() {
  const mensagem = document.getElementById('mensagem');

  try {
    const resposta = await fetch('hinos.json', { cache: 'no-store' });
    if (!resposta.ok) throw new Error('Não foi possível carregar hinos.json');

    const catalogo = await resposta.json();
    hinosCarregados = Array.isArray(catalogo) ? catalogo : (catalogo.hinos || []);
    renderizarLista();
  } catch (erro) {
    mensagem.textContent = 'Não foi possível carregar o índice de hinos.';
    console.error(erro);
  }
}

function mudarOrdenacao(tipo) {
  ordenacaoAtual = tipo;
  renderizarLista();
}

function renderizarLista() {
  const lista = document.getElementById('lista-hinos');
  lista.innerHTML = '';

  const hinos = hinosCarregados.slice();

  if (ordenacaoAtual === 'numero') {
    hinos.sort((a, b) => Number(a.numero) - Number(b.numero));
  } else {
    hinos.sort((a, b) =>
      a.titulo.localeCompare(b.titulo, 'pt-BR', { sensitivity: 'base' })
    );
  }

  hinos.forEach(hino => {
    const li = document.createElement('li');
    const link = document.createElement('a');

    link.className = 'index-link';
    link.href = `hino.html?id=${encodeURIComponent(hino.id)}`;
    link.textContent = `${hino.numero} — ${hino.titulo}`;

    li.appendChild(link);
    lista.appendChild(li);
  });
}

carregarIndice();
</script>
</body>
</html>
